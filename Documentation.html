<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kultura Collectiva — Documentation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f2;
      color: #111;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #111;
      font-size: 13px;
    }

    main {
      padding: 80px 40px;
      max-width: 1200px;
      margin: auto;
    }

    .doc-year {
      margin-bottom: 140px;
    }

    .doc-year h2 {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .doc-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .doc-gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .doc-gallery img:hover {
      transform: scale(1.03);
    }

    /* Lightbox */

    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    /* Mobile */

    @media (max-width: 768px) {
      main {
        padding: 48px 20px;
      }

      .doc-gallery {
        grid-template-columns: 1fr;
      }

      .doc-gallery img {
        height: auto;
      }

      .doc-year {
        margin-bottom: 80px;
      }
    }
  </style>
</head>
<body>

<header>
  <strong>Kultura Collectiva</strong>
  <nav>
    <a href="index.html">Home</a>
    <a href="works.html">Works</a>
    <a href="documentation.html">Documentation</a>
  </nav>
</header>

<main>

  <section class="doc-year">
    <h2>2022</h2>

    <div class="doc-gallery">
      <img src="images/doc/2022-1.jpg" alt="Documentation 2022">
      <img src="images/doc/2022-2.jpg" alt="Documentation 2022">
      <img src="images/doc/2022-3.jpg" alt="Documentation 2022">
      <img src="images/doc/2022-4.jpg" alt="Documentation 2022">
      <img src="images/doc/2022-5.jpg" alt="Documentation 2022">
      <img src="images/doc/2022-6.jpg" alt="Documentation 2022">
    </div>
  </section>

  <section class="doc-year">
    <h2>2023</h2>

    <div class="doc-gallery">
      <img src="images/doc/2023-1.jpg" alt="Documentation 2023">
      <img src="images/doc/2023-2.jpg" alt="Documentation 2023">
      <img src="images/doc/2023-3.jpg" alt="Documentation 2023">
      <img src="images/doc/2023-4.jpg" alt="Documentation 2023">
      <img src="images/doc/2023-5.jpg" alt="Documentation 2023">
      <img src="images/doc/2023-6.jpg" alt="Documentation 2023">
    </div>
  </section>

  <section class="doc-year">
    <h2>2024</h2>

    <div class="doc-gallery">
      <img src="images/doc/2024-1.jpg" alt="Documentation 2024">
      <img src="images/doc/2024-2.jpg" alt="Documentation 2024">
      <img src="images/doc/2024-3.jpg" alt="Documentation 2024">
      <img src="images/doc/2024-4.jpg" alt="Documentation 2024">
      <img src="images/doc/2024-5.jpg" alt="Documentation 2024">
      <img src="images/doc/2024-6.jpg" alt="Documentation 2024">
    </div>
  </section>

</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const images = document.querySelectorAll('.doc-gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  images.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });
</script>

</body>
</html>
